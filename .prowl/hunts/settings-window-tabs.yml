# Every Settings tab renders without the window disappearing. Toolbar tabs are
# native NSToolbarItems with no AX identifier, so they are clicked by their
# visible label. Switching tabs mutates no state.
#
# Run it:  prowl run settings-window-tabs

name: settings-window-tabs
description: Switching Settings toolbar tabs keeps the window present

steps:
  - click:
      selector: statusItem

  - click:
      selector: id=openSettings

  - waitForSelector:
      selector: id=settingsWindow
      timeout: 10000

  - click:
      selector: label="Sections"
  - waitForSelector:
      selector: id=settingsWindow
      timeout: 10000
  # The intro text is present with or without sections; the count label is not.
  - assert:
      visible: id=sectionsIntro

  - click:
      selector: label="Connections"
  - waitForSelector:
      selector: id=settingsWindow
      timeout: 10000
  # Hunt mode seeds exactly one host, named "Fixture Docker". Assertions must
  # use id= selectors; label= is only accepted on click steps.
  - assert:
      visible: id=hostRow-fixture-docker-f1a7e000-0000-4000-8000-000000000001

  - click:
      selector: label="About"
  - waitForSelector:
      selector: id=settingsWindow
      timeout: 10000
  - assert:
      visible: id=aboutVersion

  - click:
      selector: label="General"
  - waitForSelector:
      selector: id=settingsWindow
      timeout: 10000
  - assert:
      visible: id=refreshIntervalPicker
