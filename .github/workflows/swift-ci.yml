name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the toolchain line to match the release build (Xcode 26.x / Swift 6.2).
  # The runner carries several Xcode 26 point releases; prefer this exact one
  # and fall back to the newest 26.x present so a patch bump on the image does
  # not break CI, while anything older than 26 fails loudly.
  XCODE_PREFERRED: "26.2"

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_${XCODE_PREFERRED}.app" ]]; then
            selected="/Applications/Xcode_${XCODE_PREFERRED}.app"
          else
            selected="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "${selected:-}" ]]; then
            echo "::error::No Xcode 26.x found on the runner. Installed:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint
        run: |
          INSTALL_DIR="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
          ARCHIVE="$RUNNER_TEMP/swiftlint.zip"

          curl -fsSL \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            -o "$ARCHIVE" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"

          mkdir -p "$INSTALL_DIR"
          unzip -q "$ARCHIVE" -d "$INSTALL_DIR"

          SWIFTLINT_BIN="$(find "$INSTALL_DIR" -type f -name swiftlint | head -n 1)"
          if [[ -z "$SWIFTLINT_BIN" ]]; then
            echo "::error::swiftlint binary not found in release archive."
            exit 1
          fi

          chmod +x "$SWIFTLINT_BIN"
          echo "$(dirname "$SWIFTLINT_BIN")" >> "$GITHUB_PATH"
          "$SWIFTLINT_BIN" version

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging --no-cache
